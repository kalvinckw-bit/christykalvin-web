name: Deploy Shopping Mall to Firebase

on:
  push:
    branches:
      - claude/ec-resale-platform-ku6xau
      - main
    paths:
      - "public/**"
      - "functions/**"
      - "firebase.json"
      - "firestore.rules"
      - ".github/workflows/deploy-shopping.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install functions dependencies
        working-directory: functions
        run: npm ci

      - name: Deploy to Firebase (Hosting + Functions)
        # voiceout-asia 是共用 Firebase 專案，裡面還有其他站台的 functions，
        # 絕不能用 --only functions（會把本 repo 沒有的其他站台 functions 判定成要刪除）。
        # 只精準部署這個購物網站用到的 3 個 function。
        run: |
          npx firebase-tools deploy \
            --project voiceout-asia \
            --only functions:importProduct,functions:uploadPhoto,functions:deletePhoto,hosting:christykalvin-web \
            --token "${{ secrets.FIREBASE_TOKEN }}" \
            --non-interactive
