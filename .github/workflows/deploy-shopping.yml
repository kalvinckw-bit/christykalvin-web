name: Deploy Shopping Mall to Firebase

on:
  push:
    branches:
      - claude/ec-resale-platform-ku6xau
      - main
    paths:
      - "public/**"
      - "functions/**"
      - "firebase.json"
      - "firestore.rules"
      - ".github/workflows/deploy-shopping.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install functions dependencies
        working-directory: functions
        run: npm ci

      # Hosting 一定要獨立部署，而且排在最前面。
      # 之前把 hosting 跟 functions 包在同一個 deploy 指令，functions 那邊一報錯
      # （例如 artifact cleanup policy）整包就中斷，hosting 檔案雖然上傳了卻沒有
      # 完成 release，導致線上永遠是舊版。分開部署可以徹底避免這件事。
      - name: Deploy Hosting
        run: |
          npx firebase-tools deploy \
            --project voiceout-asia \
            --only hosting:christykalvin-web \
            --token "${{ secrets.FIREBASE_TOKEN }}" \
            --non-interactive \
            --force

      # voiceout-asia 是共用 Firebase 專案，裡面還有其他站台的 functions，
      # 絕不能用 --only functions（會把本 repo 沒有的其他站台 functions 判定成要刪除）。
      # 只精準部署這個購物網站用到的 3 個 function。
      - name: Deploy Functions
        run: |
          npx firebase-tools deploy \
            --project voiceout-asia \
            --only functions:importProduct,functions:uploadPhoto,functions:deletePhoto \
            --token "${{ secrets.FIREBASE_TOKEN }}" \
            --non-interactive \
            --force

      # 部署後直接抓正式站回來檢查，確認使用者實際打開的網址拿到的是新版檔案。
      # （開發用的 sandbox 連不到 christykalvin.com，只能在 CI 這邊驗證。）
      #
      # 比對方式是「本機檔案的 sha256」對「正式站回傳內容的 sha256」，
      # 不是去找某個關鍵字——關鍵字會隨著改版失效（改過一次分類名稱就誤判過），
      # 雜湊值比對則永遠不會過時，而且能精準抓到「部署宣稱成功但沒真的生效」。
      # 同時抓「原網址」與「加 cache-buster 的網址」，用來分辨 CDN 快取與來源檔案。
      - name: Verify what production actually serves
        if: always()
        run: |
          fail=0
          for page in shopping.html shopping-admin.html ; do
            expected=$(sha256sum "public/$page" | cut -d' ' -f1)
            echo "=============================================="
            echo "檔案: $page"
            echo "本機 sha256: $expected"
            for host in "https://christykalvin.com" "https://christykalvin-web.web.app" ; do
              for variant in "$host/$page" "$host/$page?cb=$(date +%s)$RANDOM" ; do
                code=$(curl -s -o /tmp/page.html -w '%{http_code}' --max-time 20 "$variant" || echo "000")
                actual=$(sha256sum /tmp/page.html | cut -d' ' -f1)
                if [ "$code" = "200" ] && [ "$actual" = "$expected" ]; then
                  echo "  ✅ $variant (HTTP $code) 內容與本機完全一致"
                else
                  echo "  ❌ $variant (HTTP $code) 內容不符，線上 sha256: $actual"
                  curl -s -I --max-time 20 "$variant" 2>/dev/null \
                    | grep -iE "^(last-modified|etag|x-served)" || true
                  fail=1
                fi
              done
            done
          done
          echo "=============================================="
          if [ "$fail" = "1" ]; then
            echo "正式站內容與這次要部署的版本不一致，部署沒有真正生效。"
            exit 1
          fi
          echo "正式站已確認是新版。"
