name: Probe Product URL

# 手動觸發：抓一個商品網址回來，report 它的資料結構。
# 用途是在為新網站（Uniqlo、GU、樂天…）寫解析規則之前，
# 先看清楚對方頁面的真實格式，而不是憑猜測改 extract.js。
# （開發用的雲端 sandbox 連不到大部分外部網站，CI 沒有這個限制。）
on:
  workflow_dispatch:
    inputs:
      url:
        description: "要偵測的商品網址"
        required: true
        type: string
  # GitHub 要這個 workflow 先跑過一次才會把它註冊成可手動觸發，
  # 所以掛一個只針對自己檔案的 push 觸發；實際偵測工作由下面的 if 擋住，
  # push 進來時整個 job 會直接 skip，不會亂抓網站。
  push:
    paths:
      - ".github/workflows/probe-url.yml"
      - "scripts/probe.js"

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install functions dependencies
        working-directory: functions
        run: npm ci
      - name: Probe
        run: node scripts/probe.js "${{ github.event.inputs.url }}"
